name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The real build: MSVC, the way app/build.ps1 builds a release (exe, DLLs, installer, Rust libraries), then the edit
  # tests, a short run of the fuzz harness with AddressSanitizer and the benchmarks' growth check.
  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/build/Release/rust
          key: cargo-${{ runner.os }}-${{ hashFiles('app/rust/Cargo.lock') }}
      - name: Build
        shell: pwsh
        run: pwsh -File app/build.ps1 -Config Release
      - name: Edit tests
        shell: pwsh
        run: pwsh -File app/tests/edit/run.ps1
      - name: Benchmarks (growth check)
        shell: pwsh
        run: pwsh -File app/tests/bench/run.ps1 -Scaling -MinTime 0.1
      - name: Fuzz (AddressSanitizer, 3000 inputs)
        shell: pwsh
        run: pwsh -File app/tests/fuzz/run.ps1 -Runs 3000 -Seed ${{ github.run_number }}
      - name: Upload the fuzz input on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-windows
          path: app/tests/out/fuzz/
          if-no-files-found: ignore

  # libFuzzer with AddressSanitizer through clang-cl (tests/fuzz/fuzz_target.cpp): coverage-guided, so a few minutes
  # reach further than many more blind runs.
  libfuzzer:
    name: libFuzzer (clang-cl)
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: |
          $msvc = 'app\tools\msvc.cmd'
          & $msvc cmake -S app -B app/build/LibFuzzer -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo `
              -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DFASTMD_LIBFUZZER=ON -DFASTMD_RUST=OFF `
              -DFASTMD_SETUP=OFF -DFASTMD_TESTS=OFF -DFASTMD_PREVIEW=OFF -DFASTMD_BENCH=OFF
          if ($LASTEXITCODE -ne 0) { throw 'configure failed' }
          & $msvc cmake --build app/build/LibFuzzer --target fastmd-libfuzzer
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
      - name: Fuzz for 5 minutes
        shell: pwsh
        run: |
          # the AddressSanitizer runtime DLL lives with the compiler, not on PATH
          $rt = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\Llvm\x64\lib\clang\*\lib\windows\clang_rt.asan_dynamic-x86_64.dll',
                              'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll' `
                -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($rt) { $env:PATH = "$($rt.DirectoryName);$env:PATH" }
          New-Item -ItemType Directory -Force fuzz-corpus, fuzz-crashes | Out-Null
          Copy-Item bench/corpus/small.md, bench/corpus/medium.md, app/tests/*.md, app/tests/fuzz/*.md fuzz-corpus/
          if (Test-Path app/tests/fuzz/regress) { Copy-Item app/tests/fuzz/regress/* fuzz-corpus/ -ErrorAction SilentlyContinue }
          & app/build/LibFuzzer/fastmd-libfuzzer.exe -max_total_time=300 -max_len=65536 -timeout=20 -rss_limit_mb=4096 `
              -artifact_prefix=fuzz-crashes/ -print_final_stats=1 fuzz-corpus
          if ($LASTEXITCODE -ne 0) { throw "libFuzzer stopped with code $LASTEXITCODE" }
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: libfuzzer-crashes
          path: fuzz-crashes/
          if-no-files-found: ignore

  # The window-free half cross-built with mingw-w64 and run under Wine: a second compiler over the same code, and a
  # check that needs no Windows machine (app/tests/mingw/build.sh).
  mingw:
    name: Linux (mingw-w64 + Wine)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64 and Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 wine64
      - name: Build and run the edit tests
        run: app/tests/mingw/build.sh test
      - name: Replay the fuzz regression inputs
        run: app/tests/mingw/build.sh regress
      - name: Benchmarks (growth check)
        run: app/tests/mingw/build.sh bench --min-time 0.1 --scaling
      - name: Fuzz for 2 minutes
        run: |
          app/tests/mingw/build.sh fuzz --seconds 60 --edit --seed ${{ github.run_number }}
          app/tests/mingw/build.sh target --seconds 60 --seed ${{ github.run_number }}
      - name: Upload the fuzz input on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-mingw
          path: app/tests/out/fuzz/
          if-no-files-found: ignore
