name: Release

# A tag v<version> builds the release on Windows, runs the tests, and creates the GitHub Release with the zip, the
# installer, their .sha256 files and the notes for that version (docs/RELEASE-<version>.md, or the version's section of
# CHANGELOG.md when there is no such file).
#
# The release is created as a DRAFT unless the repository variable RELEASE_PUBLISH is "true": the update check in
# every installed FastMD reads releases/latest, so a published release reaches users within a day. Publishing the
# draft (by hand, on GitHub) is the moment it goes out - and it also starts the winget job below.
#
# winget (optional): with the repository variable WINGET_PUBLISH set to "true" and the secret WINGET_TOKEN, a published
# release opens the pull request to microsoft/winget-pkgs with the new version's manifest (beanbo.FastMD). The first
# version of a package has to be submitted by hand (packaging/winget/README.md); this updates it from then on.
#
# Actions → Release → Run workflow builds and tests a tag (or the branch) without creating anything: a dry run.
on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to build (a dry run: nothing is released)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    if: github.event_name != 'release'
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      # the formula and diagram DLLs are Rust and the installer embeds them: the runner has no cargo of its own
      - uses: dtolnay/rust-toolchain@stable
      - name: Version
        id: version
        shell: pwsh
        run: |
          $ver = [regex]::Match((Get-Content app/CMakeLists.txt -Raw), 'project\(FastMD VERSION ([0-9]+\.[0-9]+\.[0-9]+)').Groups[1].Value
          if (-not $ver) { throw 'no version in app/CMakeLists.txt' }
          if ('${{ github.event_name }}' -eq 'push') {
              $tag = '${{ github.ref_name }}'
              # v1.3.1, or v1.3.1-rc.1 for a pre-release of the same version
              if ($tag -notmatch "^v$([regex]::Escape($ver))(-[0-9A-Za-z.-]+)?$") {
                  throw "the tag $tag does not match the version in app/CMakeLists.txt ($ver)"
              }
          }
          "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "FastMD $ver"
      - name: Build and pack
        shell: pwsh
        run: pwsh -File app/package.ps1
      - name: Edit tests
        shell: pwsh
        run: pwsh -File app/tests/edit/run.ps1
      - name: Check the package
        shell: pwsh
        run: |
          $ver = '${{ steps.version.outputs.version }}'
          $dist = 'app/out/dist'
          $files = "FastMD-$ver-win-x64.zip", "FastMD-$ver-win-x64.zip.sha256", 'FastMD-Setup.exe', 'FastMD-Setup.exe.sha256'
          foreach ($f in $files) { if (-not (Test-Path "$dist/$f")) { throw "$f is missing from $dist" } }
          foreach ($f in "FastMD-$ver-win-x64.zip", 'FastMD-Setup.exe') {
              $want = (Get-Content "$dist/$f.sha256").Split(' ')[0]
              $have = (Get-FileHash "$dist/$f" -Algorithm SHA256).Hash.ToLower()
              if ($want -ne $have) { throw "$f.sha256 does not match the file" }
          }
          $setupVer = (Get-Item "$dist/FastMD-Setup.exe").VersionInfo.FileVersion
          Write-Host "FastMD-Setup.exe version: $setupVer"
          Get-ChildItem $dist -File | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: FastMD-${{ steps.version.outputs.version }}
          path: |
            app/out/dist/FastMD-${{ steps.version.outputs.version }}-win-x64.zip
            app/out/dist/FastMD-${{ steps.version.outputs.version }}-win-x64.zip.sha256
            app/out/dist/FastMD-Setup.exe
            app/out/dist/FastMD-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      published: ${{ steps.create.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FastMD-${{ needs.build.outputs.version }}
          path: dist
      - name: Release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          notes="docs/RELEASE-$VERSION.md"
          if [ -f "$notes" ]; then
            cp "$notes" notes.md
          else
            # the version's section of CHANGELOG.md: from its "## [x.y.z]" heading to the next "## " heading
            awk -v v="$VERSION" '
              /^## / { if (on) exit; if (index($0, "## [" v "]") == 1) { on = 1; next } }
              on { print }
            ' CHANGELOG.md > notes.md
          fi
          if [ ! -s notes.md ]; then
            echo "::error::no release notes: neither docs/RELEASE-$VERSION.md nor a '## [$VERSION]' section in CHANGELOG.md"
            exit 1
          fi
          printf '\n---\n\nSHA-256:\n\n```\n%s\n%s\n```\n' "$(cat dist/*.zip.sha256)" "$(cat dist/FastMD-Setup.exe.sha256)" >> notes.md
          head -20 notes.md
      - name: Create the release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          PUBLISH: ${{ vars.RELEASE_PUBLISH }}
        run: |
          flags=()
          [ "$PUBLISH" = "true" ] || flags+=(--draft)
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" --verify-tag --title "FastMD $VERSION" --notes-file notes.md "${flags[@]}" \
            "dist/FastMD-$VERSION-win-x64.zip" "dist/FastMD-$VERSION-win-x64.zip.sha256" \
            dist/FastMD-Setup.exe dist/FastMD-Setup.exe.sha256
          if [ "$PUBLISH" = "true" ]; then echo "published=true" >> "$GITHUB_OUTPUT"; fi
          echo "### FastMD $VERSION: $([ "$PUBLISH" = "true" ] && echo published || echo 'draft - publish it on GitHub')" >> "$GITHUB_STEP_SUMMARY"

  # The pull request to microsoft/winget-pkgs, once the release is public: when the draft is published by hand (the
  # release event), or right after the release job when RELEASE_PUBLISH is "true". A GitHub-token release does not
  # start the release event, so the second path is needed as well.
  winget:
    name: winget
    needs: [release]
    if: >-
      always() && vars.WINGET_PUBLISH == 'true' && !github.event.release.prerelease &&
      (github.event_name == 'release' || needs.release.outputs.published == 'true')
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Check the token
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh
        run: if (-not $env:WINGET_TOKEN) { throw 'WINGET_PUBLISH is "true" but the secret WINGET_TOKEN is not set' }
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: beanbo.FastMD
          installers-regex: 'FastMD-Setup\.exe$'
          release-tag: ${{ github.event.release.tag_name || github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
