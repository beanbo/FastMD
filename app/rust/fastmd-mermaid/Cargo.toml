[package]
name = "fastmd-mermaid"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fastmd_mermaid"
crate-type = ["cdylib"]

[dependencies]
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
# Already inside mermaid-rs-renderer; we use it directly to measure labels with the very font the viewer draws.
ttf-parser = "0.25"
