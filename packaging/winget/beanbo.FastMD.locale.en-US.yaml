ShortDescription: Instant Markdown reader for Windows
Description: |-
  FastMD opens a Markdown document in about 66 ms - faster than an empty untuned Win32 window on the same machine.
  C++20 on raw Win32 with DirectWrite; the first frame is drawn on the CPU, with no GPU device, no COM and no
  runtime to load. It renders CommonMark and GFM, GitHub alerts, footnotes, a subset of HTML, SVG, pictures from the
  web, TeX formulas and Mermaid diagrams; it prints and exports PDF, and it installs per user without administrator
  rights.
